name: Transactie Manager
version: "0.2.0"
slug: transactie_manager
description: >-
  Huishoudboekje op basis van bankafschriften, met versleutelde opslag,
  eigen aanmelding en automatische indeling in categorieën.
url: https://github.com/GEBRUIKERSNAAM/transactie-manager
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8099
panel_icon: mdi:bank-transfer
panel_title: Transacties
# Bewust geen toegang tot /share, /config of /backup: de toepassing heeft
# alleen haar eigen /data nodig. Bestanden komen via de browser binnen.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: >-
    Rechtstreekse toegang buiten de Home Assistant-omgeving. Laat dit leeg
    tenzij je de toepassing ook zonder Home Assistant wil bereiken.
options:
  sessieduur_minuten: 120
  maximale_upload_mb: 25
schema:
  sessieduur_minuten: int(5,1440)
  maximale_upload_mb: int(1,200)
